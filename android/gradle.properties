# Mémoire du démon Gradle, réglée pour un poste de 8 Go de RAM.
#
# Le modèle de `flutter create` réserve -Xmx8G et 4 Go de métaespace : plus
# que la RAM entière de la machine. Avec VS Code, le navigateur et l'émulateur
# ouverts, la JVM finissait par ne plus obtenir de mémoire native et s'arrêtait
# net (« Gradle build daemon disappeared unexpectedly », hs_err_pid*.log).
# 2 Go de tas suffisent largement à compiler l'application.
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Le compilateur Kotlin tourne dans son propre démon : sans plafond, il prend
# jusqu'à un quart de la RAM en plus de Gradle.
kotlin.daemon.jvmargs=-Xmx1g

# Deux tâches en parallèle au plus : chaque ouvrier a son propre tas, et le
# gain d'un parallélisme plus large ne compense pas la mémoire qu'il coûte ici.
org.gradle.workers.max=2

android.useAndroidX=true
