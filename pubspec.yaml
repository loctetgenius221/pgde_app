name: pgde_app
description: "Demandes d'emploi — Ministère de la Fonction publique."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Réseau
  dio: ^5.11.1
  connectivity_plus: ^7.3.1

  # État & navigation
  flutter_riverpod: ^3.3.2
  go_router: ^17.5.0

  # Modèles (codegen)
  freezed_annotation: ^3.1.0
  json_annotation: 4.9.0

  # Stockage — token chiffré ; référentiel et brouillon en JSON (cf. ADR-002)
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.5

  # Fichiers & médias
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  flutter_image_compress: ^2.5.1   # cf. D5 — plafond serveur 2 Mo
  cached_network_image: ^3.4.1
  open_filex: ^4.7.0

  # Divers
  cupertino_icons: ^1.0.8
  intl: 0.20.2                     # épinglé par flutter_localizations
  url_launcher: ^6.3.2
  hugeicons: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

  assets:
    - assets/logo_fp.png

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700

# Icône de lancement — `dart run flutter_launcher_icons`
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  # Icône adaptative Android : le logo est rentré à 58 % pour tenir dans la
  # zone sûre de 66 % imposée par le masquage des lanceurs.
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true

# Splash natif — `dart run flutter_native_splash:create`
# Supprime le flash blanc entre le lancement du process et le premier rendu
# Flutter : l'écran natif porte déjà le logo, l'animation Dart enchaîne dessus.
flutter_native_splash:
  color: "#F6F8F7"
  color_dark: "#141615"
  image: assets/icon/splash_logo.png
  android_12:
    image: assets/icon/icon_foreground.png
    color: "#F6F8F7"
    color_dark: "#141615"
  android: true
  ios: true
